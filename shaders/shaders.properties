# Atmosphere rewrite (see shaderpacks/serievx_atmosphere_plan.md):
# colortex12 = packed atmosphere LUT (T + MS + Sky-View) at 256×256
# colortex13 = cloud shadow map at 512×512
texture.colortex12.resolution=256 256
texture.colortex13.resolution=512 512
# Required for the dedicated 3D voxel image (image.voxelImg below). Without this
# Iris refuses to load: "Custom images are being used, but the feature flag ...".
iris.features.required = CUSTOM_IMAGES

# Voxel grid — DEDICATED 3D IMAGE (anisotropic, X/Z = VOXEL_DISTANCE chunks of
# radius, vertical ±64). Explicit dims are honoured by Iris regardless of
# render resolution (unlike texture.colortexN.resolution on an image-bound
# colortex), which is what lets the grid exceed the 2D-atlas / render-res
# limits. Format: <sampler> <pixelFmt> <internalFmt> <type> <clear> <mipmap> X Y Z.
# The #if chain mirrors VOXEL_DISTANCE in options.glsl (dims = chunks*32);
# brick = dims/8, super-brick = dims/64. MUST stay in sync with voxelData.glsl.
#if VOXEL_DISTANCE == 8
    #define VOX_XZ 256
    #define BRICK_XZ 32
    #define SUPER_XZ 4
#elif VOXEL_DISTANCE == 12
    #define VOX_XZ 384
    #define BRICK_XZ 48
    #define SUPER_XZ 6
#elif VOXEL_DISTANCE == 16
    #define VOX_XZ 512
    #define BRICK_XZ 64
    #define SUPER_XZ 8
#elif VOXEL_DISTANCE == 24
    #define VOX_XZ 768
    #define BRICK_XZ 96
    #define SUPER_XZ 12
#else
    #define VOX_XZ 1024
    #define BRICK_XZ 128
    #define SUPER_XZ 16
#endif
image.voxelImg = voxelSampler RGBA_INTEGER RGBA8UI UNSIGNED_BYTE true false VOX_XZ 128 VOX_XZ
# Hierarchical occupancy for the empty-space-skipping DDA. Written by the
# shadow (voxelization) pass alongside every fine voxel store — replaces the
# old prepare2 reduction pass.
image.brickImg = brickSampler RED_INTEGER R8UI UNSIGNED_BYTE true false BRICK_XZ 16 BRICK_XZ
image.superBrickImg = superBrickSampler RED_INTEGER R8UI UNSIGNED_BYTE true false SUPER_XZ 2 SUPER_XZ
# --- Deferred chain -----------------------------------------------------------
# The world-space voxel path-tracing GI was REMOVED for the screen-space rewrite:
#   deferred   = (removed) was d0_restir  — ReSTIR resolve (gap kept)
#   deferred1  = d0_sspt   — screen-space path-traced GI producer + temporal accum
#                            -> colortex8 (.rgb GI, .a history len), colortex9.r (linear-depth reproject key)   [SSPT_GI]
# The SVGF denoiser (deferred2-7) is KEPT but disabled (GI_DENOISE off); with it
# off, d7_composite reads d0_sspt's raw GI (colortex8) directly.
#   deferred2  = d0b_historyfix     (disocclusion/edge prefilter -> colortex8)        [GI_DENOISE]
#   deferred3  = d1_atrous_first    (a-trous step 1: colortex8 -> colortex3)          [GI_DENOISE]
#   deferred4  = d1_denoise         (a-trous step 2: colortex3 -> colortex6)          [GI_DENOISE]
#   deferred5  = d2_denoise         (a-trous step 4: colortex6 -> colortex3)          [GI_DENOISE]
#   deferred6  = d3_denoise         (a-trous step 8: colortex3 -> colortex6)          [GI_DENOISE]
#   deferred7  = d4_denoise         (a-trous step 16: colortex6 -> colortex3)         [GI_DENOISE]
#   deferred8  = d7_composite       (scene lighting; reads colortex3 GI when denoised, else colortex8)
#   deferred9  = d7b_reflections    (gated by SPECULAR_REFLECTIONS)
#   deferred10 = d7c_reflection_spatial (gated by SPECULAR_REFLECTIONS)
#   deferred11 = d8_fog_sky
#   deferred12 = d9_vl              (gated by VOLUMETRIC_LIGHT)
program.deferred1.enabled = SSPT_GI
program.deferred9.enabled = SPECULAR_REFLECTIONS
program.deferred10.enabled = SPECULAR_REFLECTIONS
program.deferred12.enabled = VOLUMETRIC_LIGHT

# SVGF spatial filter. When GI_DENOISE is off, d7_composite reads the raw
# temporally-accumulated GI (colortex8) directly. The a-trous chain ping-pongs
# colortex3<->colortex6: step1->ct3, step2->ct6, step4->ct3, step8->ct6, step16->ct3.
# SVGF_ATROUS_PASSES (options) enables passes via SVGF_P2..P5; d7 reads whichever buffer
# holds the last pass (SVGF_FINAL_BUFFER). deferred2 (historyfix) is gated separately.
program.deferred2.enabled = GI_HISTORYFIX
program.deferred3.enabled = GI_DENOISE
program.deferred4.enabled = SVGF_P2
program.deferred5.enabled = SVGF_P3
program.deferred6.enabled = SVGF_P4
program.deferred7.enabled = SVGF_P5

# Skip the cloud-shadow build pass when CLOUDS_SHADOW is off. d7's
# sampleCloudShadow() already short-circuits to 1.0 in that case, so the
# buffer is never read — prepare1 would just be a wasted dispatch.
program.prepare1.enabled = CLOUDS_SHADOW

# Cloud noise (offline-baked by shaderpacks/volume-noise-generator/).
# cloud_base   (128³ RGBA8): R=perlin-worley shape, G=worley erode mid, B=worley erode hi, A=coverage perlin
# cloud_detail ( 32³ RGBA8): R=curl, G=worley wisp, B=worley sharp wisp, A=boiling perlin
#
# customTexture.<name> binds globally across ALL stages — Iris's per-stage
# `texture.<stage>.<name>` form only accepts reserved sampler names
# (noisetex/colortex0..15/depthtex/shadowtex) or rebinds via .N suffix.
# Custom GLSL uniform names like cloudNoiseBase must use customTexture.
customTexture.cloudNoiseBase=noise/cloud_base.dat TEXTURE_3D RGBA8 128 128 128 RGBA UNSIGNED_BYTE
customTexture.cloudNoiseDetail=noise/cloud_detail.dat TEXTURE_3D RGBA8 32 32 32 RGBA UNSIGNED_BYTE
# Spatiotemporal blue noise (NVIDIA STBN, cosine hemisphere): 128x128 spatial tile x 64 temporal frames.
# RGB = cosine-weighted dir in the +Z hemisphere (decode *2-1); sampled in d0_restir for GI ray directions.
customTexture.blueNoise=noise/stbn_cosine.dat TEXTURE_3D RGBA8 128 128 64 RGBA UNSIGNED_BYTE

# Query LUT atlas. Bound only during composite stages;
# colortex6 is otherwise free for post-processing.
texture.composite.colortex6 = /lib/IMG/Luts2.png
