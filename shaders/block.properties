# Serie Block Properties
# ----------------------------------------------------------------------------
# BLOCK-ID COVERAGE MAP (which system consumes which mc_Entity id). A block can
# only hold ONE id, so an id chosen here decides ALL of: voxel category, water
# path, emission, AND integrated-PBR class. NEVER dual-list (emission/voxel win
# over PBR — see the regression where sea_lantern stopped emitting).
#
#   id range     consumer(s)                                       set by / read in
#   ---------    ----------------------------------------------    ----------------------------
#   10000        leaves -> foliage voxel (soft NdotL)              terrain.glsl, shadow.glsl
#   10001        emissive fallback -> VOXEL_EMISSIVE               terrain.glsl, shadow.glsl
#   10002        excluded from voxels (tiny geometry)              shadow.glsl (-> VOXEL_AIR)
#   10003        biome-tinted ground (grass_block)                 shadow.glsl (biomeTinted)
#   10004        glass group (tint+refraction, voxel-excluded)     c_water.glsl, shadow.glsl
#   10005        foliage 1 (grass/flowers, voxel-excluded)         terrain.glsl, shadow.glsl
#   10006        water (deferred surface)                          c_water.glsl, shadow.glsl
#   10007/10008  clear ice / solid ice                             c_water.glsl, terrain.glsl
#   10100-10199  special blocklights (10100+mat) -> EMISSIVE       blocklightColors.glsl, shadow/gi
#   20000-20066  voxel sub-block shapes (20000+shapeId), GENERIC pbr  shadow.glsl, voxelData.glsl (gen script)
#                  leftover shaped blocks w/ no clean material (snow/cake/pots/...)
#   30000-31666  SHAPED + per-material PBR (30000 + pbrClass*100 + shapeId)  shadow.glsl + terrain.glsl
#                  shape = id%100 (voxelizes like the 20xxx twin); material = id/100
#                  (pbrClass 1-16 as below). stairs/slabs/walls/fences/gates/doors/
#                  trapdoors split per material here. GENERATED (jobs gen.py).
#   21001-21016  INTEGRATED PBR class, OPAQUE (pbrClass=id-21000)        terrain.glsl, d7b/d7c
#                  1 metal  2 raw-metal  3 polished-stone  4 quartz/ceramic  5 gem
#                  6 dark-glossy  7 prismarine  8 glazed  9 concrete  10 terracotta
#                  11 bricks  12 rough-stone  13 wood  14 dirt  15 sand/gravel  16 wool
#   22001-22008  INTEGRATED PBR class, VOXEL-EXCLUDED (pbrClass=id-22000) terrain.glsl + shadow.glsl
#                  reflective thin/cutout blocks (rails, bars) that must NOT occlude GI
#   23000+       reserved (future labPBR overrides)
# block.10000 = Foliage 2 (leaves - voxelized, soft NdotL)
# block.10001 = Emissive (light sources - voxelized as VOXEL_EMISSIVE) [Modded/Fallback]
# block.10002 = Excluded from voxels (tiny geometry: buttons, rails, signs, ...)
# block.10003 = Biome-tinted ground (grass_block)
# block.10004 = Transparent (glass, ice, water)
# block.10005 = Foliage 1 (grass, flowers, crops, vines - excluded from voxels, soft NdotL)
# block.10006 = Water (deferred surface shading - waves/refraction/reflection; excluded from voxels)

# Foliage 2: Leaves and vines that should block light as full voxels but have soft shading
block.10000=leaves leaves2 oak_leaves spruce_leaves birch_leaves jungle_leaves acacia_leaves dark_oak_leaves azalea_leaves flowering_azalea_leaves mangrove_leaves cherry_leaves pale_oak_leaves cobweb

